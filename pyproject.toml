[project]
name = "trickfish"
version = "0.1.0"
description = "Chess engine research project"
requires-python = ">=3.11"

[project.optional-dependencies]
practical = ["maia2==0.11.0; python_version < '3.13'"]

[project.scripts]
trickfish = "trickfish.cli:main"
trickfish-uci = "trickfish.uci:main"
trickfish-practical = "trickfish.practical_cli:main"
trickfish-practical-stability = "trickfish.practical_stability:main"
trickfish-practical-pgn = "trickfish.practical_pgn:main"
trickfish-practical-review = "trickfish.practical_review:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
