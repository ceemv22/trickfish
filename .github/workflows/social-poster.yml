name: social-poster

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (post nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests requests-oauthlib
      - name: Post due entries
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          flags=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then flags="--dry-run"; fi
          python social/post.py $flags
      - name: Commit state
        if: always()
        run: |
          if git diff --quiet -- social/state.json; then
            echo "state unchanged"
          else
            git config user.name "trickfish-bot"
            git config user.email "trickfish-bot@users.noreply.github.com"
            git add social/state.json
            git commit -m "social: update posting state"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push
          fi
