name: Workbook Windows Package

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/trickfish/workbook*.py'
      - 'src/trickfish/data/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - '.github/workflows/workbook-windows.yml'
  pull_request:
    paths:
      - 'src/trickfish/workbook*.py'
      - 'src/trickfish/data/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - '.github/workflows/workbook-windows.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-workbook-build.txt
      - name: Build and exercise frozen application
        run: python packaging/build_workbook.py --output dist/workbook-windows
      - name: Preserve internal package and smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: workbook-windows-internal-${{ github.sha }}
          path: |
            dist/workbook-windows/TrickfishWorkbook-windows-x64.zip
            dist/workbook-windows/archive.sha256
            dist/workbook-windows/build-receipt.json
            dist/workbook-windows/smoke/
          if-no-files-found: error
