name: C++ Core

on:
  push:
    paths:
      - CMakeLists.txt
      - cpp/**
      - .github/workflows/cpp-core.yml
  pull_request:
    paths:
      - CMakeLists.txt
      - cpp/**
      - .github/workflows/cpp-core.yml

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64
      - name: Build Linux
        if: runner.os == 'Linux'
        run: cmake --build build --config Release
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & cmake --build build --config Release 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exitCode -ne 0) {
            $message = $output | Out-String
            if ($message.Length -gt 12000) {
              $message = $message.Substring($message.Length - 12000)
            }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows compiler output::$message"
            exit $exitCode
          }
      - name: Verify FEN round-trip
        shell: pwsh
        run: |
          $fen = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
          $binary = if ($IsWindows) { ".\build\Release\trickfish_cpp.exe" } else { "./build/trickfish_cpp" }
          $actual = & $binary $fen
          if ($actual -ne $fen) {
            throw "FEN round-trip mismatch: $actual"
          }
          $nodes = & $binary --perft 3
          if ($nodes -ne "8902") {
            throw "Initial-position perft(3) mismatch: $nodes"
          }
