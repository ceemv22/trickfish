name: C++ Core

on:
  push:
    paths:
      - CMakeLists.txt
      - cpp/**
      - .github/workflows/cpp-core.yml
  pull_request:
    paths:
      - CMakeLists.txt
      - cpp/**
      - .github/workflows/cpp-core.yml

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64
      - name: Build Linux
        if: runner.os == 'Linux'
        run: cmake --build build --config Release
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = & cmake --build build --config Release 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exitCode -ne 0) {
            $message = $output | Out-String
            if ($message.Length -gt 12000) {
              $message = $message.Substring($message.Length - 12000)
            }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows compiler output::$message"
            exit $exitCode
          }
      - name: Verify FEN round-trip
        shell: pwsh
        run: |
          $fen = "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"
          $binary = if ($IsWindows) { ".\build\Release\trickfish_cpp.exe" } else { "./build/trickfish_cpp" }
          $actual = & $binary $fen
          if ($actual -ne $fen) {
            throw "FEN round-trip mismatch: $actual"
          }
          $nodes = & $binary --perft 3
          if ($nodes -ne "8902") {
            Write-Output "::error title=Initial position perft mismatch::Expected 8902, got $nodes"
            throw "Initial-position perft(3) mismatch: $nodes"
          }
          $cases = @(
            @{
              Name = "Kiwipete"
              Fen = "r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1"
              Depth = 3
              Expected = "97862"
            },
            @{
              Name = "Endgame"
              Fen = "8/2p5/3p4/KP5r/1R3p1k/8/4P1P1/8 w - - 0 1"
              Depth = 3
              Expected = "2812"
            },
            @{
              Name = "Promotions"
              Fen = "r3k2r/Pppp1ppp/1b3nbN/nP6/BBP1P3/q4N2/Pp1P2PP/R2Q1RK1 w kq - 0 1"
              Depth = 3
              Expected = "9467"
            }
          )
          foreach ($case in $cases) {
            $actualNodes = & $binary --perft $case.Depth $case.Fen
            if ($actualNodes -ne $case.Expected) {
              Write-Output "::error title=$($case.Name) perft mismatch::Expected $($case.Expected), got $actualNodes"
              throw "$($case.Name) perft($($case.Depth)) mismatch: $actualNodes"
            }
          }
      - name: Verify incremental Zobrist updates
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify perft divide
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { ".\build\Release\trickfish_cpp.exe" } else { "./build/trickfish_cpp" }
          $lines = @(& $binary --divide 3)
          if ($LASTEXITCODE -ne 0) { throw "Divide execution failed" }
          if ($lines.Count -ne 21 -or $lines[-1] -ne "total 8902" -or
              $lines -notcontains "e2e4 600" -or $lines -notcontains "b1c3 440") {
            throw "Initial-position divide mismatch: $($lines -join ', ')"
          }
          $sum = 0L
          $seen = @{}
          foreach ($line in $lines[0..19]) {
            if ($line -notmatch '^([a-h][1-8][a-h][1-8]) ([0-9]+)$') {
              throw "Invalid divide row: $line"
            }
            $move = $Matches[1]
            if ($seen.ContainsKey($move)) { throw "Duplicate divide move: $move" }
            $seen[$move] = $true
            $sum += [long]$Matches[2]
          }
          if ($sum -ne 8902) { throw "Divide rows do not sum to 8902" }
          $single = @(& $binary --divide 1)
          if ($LASTEXITCODE -ne 0 -or $single.Count -ne 21 -or $single[-1] -ne "total 20") {
            throw "Depth-one divide mismatch"
          }
