name: Practical Integration

on:
  workflow_dispatch:
    inputs:
      case:
        description: Review position
        type: choice
        options:
          - all
          - initial
          - quiet-italian
          - stafford-entry
          - englund-entry
          - scholar-threat-black-defense
        default: all
      depth:
        description: Objective search depth
        type: choice
        options: ['4', '6', '8']
        default: '4'
      comparison:
        description: Depth comparison or single-depth review
        type: choice
        options: ['4,6', '6,8', 'single']
        default: '4,6'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional model and objective engine
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install maia2==0.11.0
          sudo apt-get update
          sudo apt-get install -y stockfish
      - name: Run real-model review
        env:
          PYTHONPATH: src
          REVIEW_CASE: ${{ inputs.case }}
          REVIEW_DEPTH: ${{ inputs.depth }}
          REVIEW_COMPARISON: ${{ inputs.comparison }}
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          case_args=()
          if [ "$REVIEW_CASE" != all ]; then case_args=(--case "$REVIEW_CASE"); fi
          depth_args=(--depth "$REVIEW_DEPTH")
          if [ "$REVIEW_COMPARISON" = '4,6' ]; then depth_args=(--depths 4 6); fi
          if [ "$REVIEW_COMPARISON" = '6,8' ]; then depth_args=(--depths 6 8); fi
          python examples/run_practical_review.py --engine /usr/games/stockfish --maia-cache "$RUNNER_TEMP/maia-models" --output-dir review "${depth_args[@]}" "${case_args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practical-review-${{ github.sha }}
          path: review
          if-no-files-found: warn
