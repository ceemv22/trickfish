name: Practical Integration

on:
  workflow_dispatch:
    inputs:
      case:
        description: Review position
        type: choice
        options:
          - all
          - initial
          - quiet-italian
          - stafford-entry
          - englund-entry
          - scholar-threat-black-defense
        default: all
      depth:
        description: Objective search depth
        type: choice
        options: ['4', '6', '8', '12']
        default: '4'
      comparison:
        description: Depth comparison or single-depth review
        type: choice
        options: ['4,6', '6,8', '8,12', 'single']
        default: '4,6'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install optional model and objective engine
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-practical.txt
          python -m pip freeze > practical-environment.txt
      - name: Prepare pinned Stockfish 19
        env:
          PYTHONPATH: src
        run: |
          python examples/prepare_stockfish.py --output-dir "$RUNNER_TEMP/stockfish19"
          cp "$RUNNER_TEMP/stockfish19/release.json" stockfish-release.json
      - name: Run real-model review
        env:
          PYTHONPATH: src
          REVIEW_CASE: ${{ inputs.case }}
          REVIEW_DEPTH: ${{ inputs.depth }}
          REVIEW_COMPARISON: ${{ inputs.comparison }}
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          case_args=()
          if [ "$REVIEW_CASE" != all ]; then case_args=(--case "$REVIEW_CASE"); fi
          depth_args=(--depth "$REVIEW_DEPTH")
          if [ "$REVIEW_COMPARISON" = '4,6' ]; then depth_args=(--depths 4 6); fi
          if [ "$REVIEW_COMPARISON" = '6,8' ]; then depth_args=(--depths 6 8); fi
          if [ "$REVIEW_COMPARISON" = '8,12' ]; then depth_args=(--depths 8 12); fi
          python examples/run_practical_review.py --engine "$RUNNER_TEMP/stockfish19/stockfish/stockfish-linux-x86-64-universal" --stockfish19 --maia-cache "$RUNNER_TEMP/maia-models" --output-dir review "${depth_args[@]}" "${case_args[@]}"
          if [ "$REVIEW_COMPARISON" = '8,12' ]; then
            if [ "$REVIEW_CASE" = all ]; then
              python examples/build_expert_review.py --screen-dir review/depth-8 --verification-dir review/depth-12 --output-dir review/expert-review
            else
              python -m trickfish.practical_review "review/depth-8/$REVIEW_CASE.json" "review/depth-12/$REVIEW_CASE.json" --output-dir review/expert-review
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practical-review-${{ github.sha }}
          path: |
            review
            practical-environment.txt
            stockfish-release.json
            requirements-practical.txt
          if-no-files-found: warn
