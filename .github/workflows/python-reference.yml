name: Python Reference

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reference and practical-selection tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Workbook dependencies
        run: python -m pip install "chess==1.10.0" "reportlab>=4.2,<5" pypdf
      - name: Workbook export tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p test_workbook.py -v
