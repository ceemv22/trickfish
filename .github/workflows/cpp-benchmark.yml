name: C++ Binary Comparison

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cpp-benchmark.yml']
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Baseline Git ref with compatible diagnostic search CLI
        required: true
        default: 9cceed777bdd9dc0bfb73c09ca1e209635de4e54
        type: string
      baseline_kernel:
        description: Baseline kernel and timing assessment policy
        required: true
        default: ray
        type: choice
        options: [ray, reference]
      depth:
        description: Fixed search depth from 1 to 64
        required: true
        default: '6'
        type: string
      repeats:
        description: Paired repeats, at least 2
        required: true
        default: '6'
        type: string
      require_identical_trace:
        description: Require identical nodes, root move and PV
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  compare:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BENCHMARK_DEPTH: ${{ inputs.depth || '6' }}
      BENCHMARK_REPEATS: ${{ inputs.repeats || '6' }}
      REQUIRE_TRACE: ${{ github.event_name == 'push' || inputs.require_identical_trace }}
      BASELINE_KERNEL: ${{ inputs.baseline_kernel || 'ray' }}
      BASELINE_RAY_SLIDERS: ${{ inputs.baseline_kernel == 'reference' && 'OFF' || 'ON' }}
      BENCHMARK_EXPERIMENT: ponder-default-search-compatibility
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline_ref || '9cceed777bdd9dc0bfb73c09ca1e209635de4e54' }}
          path: baseline-source
          persist-credentials: false
      - name: Install Python reference
        run: python -m pip install -e .
      - name: Configure both Release builds
        shell: pwsh
        run: |
          if ($IsWindows) {
            cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DTRICKFISH_RAY_SLIDERS=ON
            if ($LASTEXITCODE -ne 0) { throw "Candidate configure failed" }
            cmake -S baseline-source -B baseline-source/build -A x64 -DBUILD_TESTING=OFF -DTRICKFISH_RAY_SLIDERS=$env:BASELINE_RAY_SLIDERS
          } else {
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DTRICKFISH_RAY_SLIDERS=ON
            if ($LASTEXITCODE -ne 0) { throw "Candidate configure failed" }
            cmake -S baseline-source -B baseline-source/build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DTRICKFISH_RAY_SLIDERS=$env:BASELINE_RAY_SLIDERS
          }
          if ($LASTEXITCODE -ne 0) { throw "Baseline configure failed" }
      - name: Build both engines
        shell: pwsh
        run: |
          cmake --build build --config Release --target trickfish_cpp trickfish_sliding_kernel_bench --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Candidate build failed" }
          cmake --build baseline-source/build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Baseline build failed" }
      - name: Compare same-runner search workloads
        shell: pwsh
        run: |
          $candidateBinary = if ($IsWindows) { ".\build\Release\trickfish_cpp.exe" } else { "./build/trickfish_cpp" }
          $baselineBinary = if ($IsWindows) { ".\baseline-source\build\Release\trickfish_cpp.exe" } else { "./baseline-source/build/trickfish_cpp" }
          $kernel = & $candidateBinary --slider-kernel
          if ($LASTEXITCODE -ne 0 -or $kernel -ne "ray") { throw "Candidate ray kernel was not selected" }
          if ($env:BASELINE_KERNEL -eq "ray") {
            $baselineKernel = & $baselineBinary --slider-kernel
            if ($LASTEXITCODE -ne 0 -or $baselineKernel -ne "ray") { throw "Baseline ray kernel was not selected" }
          }
          $benchmarkArguments = @("cpp/bench/search_benchmark.py", $candidateBinary, "--reference-binary", $baselineBinary, "--depth", $env:BENCHMARK_DEPTH, "--repeats", $env:BENCHMARK_REPEATS, "--warmups", "2", "--timeout", "120", "--output", "build/binary-comparison.json")
          if ($env:REQUIRE_TRACE -eq "true") { $benchmarkArguments += "--reference-trace" }
          python @benchmarkArguments
          if ($LASTEXITCODE -ne 0) { throw "Binary comparison failed" }
          python -c "import json,subprocess,os; from pathlib import Path; p=Path('build/binary-comparison.json'); d=json.loads(p.read_text()); d['build_provenance']={'candidate_revision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'baseline_revision':subprocess.check_output(['git','-C','baseline-source','rev-parse','HEAD'],text=True).strip(),'configuration':'Release','same_runner':True,'candidate_kernel':'ray','baseline_kernel_requested':os.environ['BASELINE_KERNEL'],'experiment':os.environ['BENCHMARK_EXPERIMENT']}; p.write_text(json.dumps(d,indent=2,allow_nan=False),encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw "Build provenance recording failed" }
          python cpp/bench/summarize_binary_benchmark.py build/binary-comparison.json --output build/binary-comparison-summary.json
          if ($LASTEXITCODE -ne 0) { throw "Binary benchmark summary failed" }
          Get-Content build/binary-comparison.json
          Get-Content build/binary-comparison-summary.json
      - name: Profile both sliding kernels in the same process
        shell: pwsh
        run: |
          $profiler = if ($IsWindows) { ".\build\Release\trickfish_sliding_kernel_bench.exe" } else { "./build/trickfish_sliding_kernel_bench" }
          $json = & $profiler 512
          if ($LASTEXITCODE -ne 0) { throw "Sliding kernel profile failed" }
          $json | Set-Content build/sliding-kernel.json
          python cpp/bench/summarize_sliding_profile.py build/sliding-kernel.json --output build/sliding-kernel-summary.json
          if ($LASTEXITCODE -ne 0) { throw "Sliding kernel profile validation failed" }
          Get-Content build/sliding-kernel.json
          Get-Content build/sliding-kernel-summary.json
      - name: Report per-job sliding timing readiness
        shell: pwsh
        run: |
          python cpp/bench/assess_sliding_candidate.py build/binary-comparison.json build/sliding-kernel.json --baseline-kernel $env:BASELINE_KERNEL --output build/sliding-assessment.json
          if ($LASTEXITCODE -ne 0) { throw "Invalid sliding assessment inputs" }
          Get-Content build/sliding-assessment.json
      - name: Preserve comparison reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: binary-comparison-${{ matrix.os }}-${{ github.sha }}
          path: |
            build/binary-comparison.json
            build/binary-comparison-summary.json
            build/sliding-kernel.json
            build/sliding-kernel-summary.json
            build/sliding-assessment.json
          if-no-files-found: warn
          retention-days: 30
